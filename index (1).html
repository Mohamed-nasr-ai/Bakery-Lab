function debounce(fn,ms){

    var args=arguments;
    var ctx=this;
    clearTimeout(t);
    t=setTimeout(function(){fn.apply(ctx,args)},ms);
  };
}

function getCatCount(catId){
  var limit=(STATE.user&&STATE.user.plan==="basic")?25:200;

  if(catId==="all")return RECIPES.filter(function(r){return r.id<=limit;}).length+adminR.length+customs.length;

function renderRecipesList(){

  const s=STATE.search.trim().toLowerCase();

const allRecipes=RECIPES.concat(STATE.adminRecipes||[]).concat(CUSTOM_RECIPES||[]);

const limit=(STATE.user&&STATE.user.plan==="basic")?100:200;

  const filtered=allRecipes.filter(r=>{

if(typeof r.id==="number"&&r.id>limit)return false;

    const okCat=STATE.cat==="all"?(r.custom!==true||r.isAdminRecipe):(STATE.cat==="fav"?isFav(r.id):(STATE.cat==="custom"?(r.custom===true&&!r.isAdminRecipe):(r.c===STATE.cat&&(r.custom!==true||r.isAdminRecipe))));

    const okS=!s||r.t.toLowerCase().includes(s)||r.d.toLowerCase().includes(s)||r.ing.some(i=>i[0].includes(s));

    return okCat&&okS;

function openEditRecipe(){

  var ingText=(r.ing||[]).map(function(i){return i[0]+" - "+(parseFloat(i[1])||0);}).join("\n");

async function saveCustomRecipe(){
var ed=STATE.editingRecipe||null;
  var u=STATE.user||{};
  var isAdminUser=(STATE.user&&STATE.user.role==="admin")?true:false;
  var title=toEnglishNum(document.getElementById("cr-title").value.trim());
var cat=document.getElementById("cr-cat").value;
var desc=toEnglishNum(document.getElementById("cr-desc").value.trim());
var ingText=toEnglishNum(document.getElementById("cr-ing").value.trim());
var stepsText=toEnglishNum(document.getElementById("cr-steps").value.trim());
var toolsText=toEnglishNum(document.getElementById("cr-tools").value.trim());
var tip=toEnglishNum(document.getElementById("cr-tip").value.trim());
var shelf=toEnglishNum(document.getElementById("cr-shelf").value.trim());
var store=toEnglishNum(document.getElementById("cr-store").value.trim());
var unit=toEnglishNum(document.getElementById("cr-unit").value.trim())||"قطعة";
var baseYield=parseInt(toEnglishNum(document.getElementById("cr-baseyield").value))||8;
var temp=toEnglishNum(document.getElementById("cr-temp").value.trim());
var timeprep=toEnglishNum(document.getElementById("cr-timeprep").value.trim());
var timerest=toEnglishNum(document.getElementById("cr-timerest").value.trim());
var timebake=toEnglishNum(document.getElementById("cr-timebake").value.trim());
  var allergensRaw=document.getElementById("cr-allergens").value.trim();
  var cal=toEnglishNum(document.getElementById("cr-cal").value.trim());
  var countryInput=document.getElementById("cr-country");
var standardInput=document.getElementById("cr-standard");
var country=countryInput?toEnglishNum(countryInput.value.trim()):"";
var standard=standardInput?toEnglishNum(standardInput.value.trim()):"";
var originParts=[country,standard].filter(function(x){return x;});
var origin=originParts.join(" • ");
var difficulty=(document.getElementById("cr-difficulty")||{}).value||"متوسط";
  var allergens=allergensRaw?allergensRaw.split(",").map(function(x){return x.trim();}).filter(function(x){return x;}):[];
  if(!title||!desc||!ingText||!stepsText||!shelf||!store){toast("اكتبي كل البيانات الأساسية","err");return;}
  
  var catNames={oriental:"مخبوزات شرقية",western:"مخبوزات غربية","pastry-east":"معجنات شرقية","pastry-west":"معجنات غربية","sweet-east":"حلويات شرقية","sweet-west":"حلويات غربية"};
  var parsedIngs=ingText.split("\n").filter(function(x){return x.trim();}).map(function(x){var m=x.match(/^(.+?)[\s\-:,=\t]+(\d+(?:\.\d+)?)\s*(جم|جرام|جرامات|g|مل|ml)?[\s\-:,=\t]*(.*)$/i);var nm=m?m[1].trim():x.trim();var qty=m?parseFloat(m[2]):0;var note=m&&m[4]?m[4].trim():"";return {name:nm,qty:qty,note:note};});
var firstQty=parsedIngs[0]?parsedIngs[0].qty:0;
var ings=parsedIngs.map(function(i){var pct=firstQty?Math.round((i.qty/firstQty)*1000)/10:0;return {name:i.name,g1000:String(i.qty),pct:pct+"%",note:i.note};});
  var steps=stepsText.split("\n").filter(function(x){return x.trim();}).map(function(x){return x.trim();});
  var tools=toolsText?toolsText.split("\n").filter(function(x){return x.trim();}).map(function(x){return x.trim();}):["—"];
  try{
    var recipeData={
      isAdminRecipe:(STATE.user&&STATE.user.role==="admin"&&!ed)?true:((ed&&ed.isAdminRecipe)?true:false),
      ownerId:(ed&&ed.ownerId)?ed.ownerId:(u.id||""),
      ownerName:(ed&&ed.ownerName)?ed.ownerName:(u.name||""),
      t:title,
      c:cat,
      cat:catNames[cat]||"مخبوزات شرقية",
      es:"CUSTOM",
iso:"CUSTOM",
origin:isAdminUser?(origin||"وصفة جديدة"):("وصفة مخصصة من "+(u.name||"")),
difficulty:difficulty||"متوسط",
      d:desc,
      unit:unit,
      baseYield:baseYield,
      time:{prep:timeprep||"—",rest:timerest||"—",bake:timebake||"—"},
      temp:temp||"—",
      shelf:shelf,
      store:store,
      cal:cal||"—",
      allergens:allergens,
      warn:isAdminUser?[]:["⚠️ وصفة مخصصة من "+(u.name||"")+" - هذه الوصفة مسؤولية صاحبها، ولا يتحمل مالك التطبيق الأصلي أي مسؤولية عن صحتها أو نتائجها"],
      ing:ings,
      tools:tools,
      steps:steps,
      tip:tip||"—",
      cost:"—",
      profit:"—",
      custom:true
    };
    if(ed){
      await CUSTOM_COL.doc(ed.fbId).update(recipeData);
      toast("✓ تم حفظ التعديل");
    }else{
      recipeData.createdAt=new Date().toISOString();
      recipeData.displayNum=(STATE.adminRecipes?STATE.adminRecipes.length:0)+201;
      await CUSTOM_COL.add(recipeData);
      toast("✓ تم حفظ الوصفة");
    }
    STATE.editingRecipe=null;
    if(recipeData.isAdminRecipe){STATE.screen="dashboard";STATE.cat="all";}
    else if(STATE.user&&STATE.user.role==="admin"){STATE.screen=STATE.cameFrom||"customerRecipes";}
    else{STATE.screen="dashboard";STATE.cat="custom";}
    render();
    window.scrollTo(0,0);
  }catch(e){console.error(e);toast("فشل: "+(e.message||e.code||"غير معروف"),"err");}
}

  });

function closeCostEditor(){
  var m=document.getElementById("cost-modal");
  if(m)m.remove();
}

function saveCostEditor(){
  var r=STATE.sel;
  if(!r)return;
  var uc=parseFloat(toEnglishNum(document.getElementById("ce-unitCost").value))||0;
  var fc=parseFloat(toEnglishNum(document.getElementById("ce-fixedCost").value))||0;
  var sp=parseFloat(toEnglishNum(document.getElementById("ce-sellPrice").value))||0;
  localStorage.setItem("bakery_cost_"+r.id+"_unitCost",uc);
  localStorage.setItem("bakery_cost_"+r.id+"_fixedCost",fc);
  localStorage.setItem("bakery_cost_"+r.id+"_sellPrice",sp);
  closeCostEditor();
  toast("تم حفظ الأسعار ✓");
  render();
}

function resetCostEditor(){
  var r=STATE.sel;
  if(!r)return;
  localStorage.removeItem("bakery_cost_"+r.id+"_unitCost");
  localStorage.removeItem("bakery_cost_"+r.id+"_fixedCost");
  localStorage.removeItem("bakery_cost_"+r.id+"_sellPrice");
  closeCostEditor();
  toast("تم استرجاع الأسعار الأصلية ✓");
  render();
}
function fixYieldInput(){
  var input = document.getElementById("yield-input");
  if(!input) return;
  var val = parseInt(input.value);
  if(isNaN(val) || val < 1){
    val = 1;
  } else if(val > 200){
    val = 200;
  }
  input.value = val;
  STATE.currentYield = val;
  updateYields(val);
}


function changeYield(delta){
  var input = document.getElementById("yield-input");
  if(!input) return;
  var val = Math.max(1, Math.min(200, (parseInt(input.value)||1) + delta));
  input.value = val;
  updateYields(val);
}

function setYield(val){
  var input = document.getElementById("yield-input");
  if(input) input.value = val;
  updateYields(val);
}

function updateYields(newYield){
  var r = STATE.sel;
  if(!r || !r.baseYield) return;
  newYield = toEnglishNum(newYield);
  var input = document.getElementById("yield-input");
  if(input && input.value !== newYield) input.value = newYield;
  if(newYield === '' || newYield === null || newYield === undefined) return;
  var num = parseInt(newYield);
  if(isNaN(num) || num < 1) return;
  num = Math.min(200, num);
  STATE.currentYield = num;
  var factor = num / r.baseYield;
  document.querySelectorAll(".ing-amount").forEach(function(el){
    var base = parseFloat(el.dataset.base) || 0;
    var amount = base * factor;
    var display = (amount % 1 === 0) ? amount : amount.toFixed(1);
    el.textContent = display + " جم";
  });
}

function fillVars(text, r, factor){
  if(!text || !r || !r.ing) return text;
  return String(text).replace(/\{\{(\d+)\}\}/g, function(m, idx){
    var ing = r.ing[parseInt(idx)];
    if(!ing) return m;
    var base = parseFloat(ing[1]) || 0;
    var val = base * factor;
    var display = (val % 1 === 0) ? val : val.toFixed(1);
    return display;
  });
}


function renderSteps(r){
  var currentYield = STATE.currentYield || r.baseYield || 1;
  var factor = currentYield / (r.baseYield || 1);
  return '<div style="margin-top:20px;display:flex;flex-direction:column;gap:12px">'+
    r.steps.map(function(s,i){

        '<p style="font-size:13px;line-height:1.6;margin:2px 0;flex:1">'+esc(fillVars(s, r, factor))+'</p>'+

function renderClientsList(){
  if(!STATE.clients.length)return '<p style="text-align:center;color:#64748b;padding:24px 0;font-size:12px">لا يوجد عملاء بعد</p>';
  var now=new Date();
  var weekFromNow=new Date(now.getTime()+7*24*60*60*1000);
  var monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  var flt=STATE.clientsFilter||"all";
  var search=STATE.clientSearch.toLowerCase().trim();
  var filtered=STATE.clients.filter(function(c){
    var exp=new Date(c.expiry);
    if(flt==="active"&&!(exp>=now))return false;
    if(flt==="expired"&&!(exp<now))return false;
    if(flt==="expiring"&&!(exp>=now&&exp<=weekFromNow))return false;
    if(flt==="new"){if(!c.createdAt)return false;if(new Date(c.createdAt)<monthStart)return false;}
    if(!search)return true;
    return c.name.toLowerCase().includes(search)||c.phone.includes(search)||(c.codePlain||"").toLowerCase().includes(search);
  });
  if(flt==="activity"){filtered.sort(function(a,b){return (b.used||0)-(a.used||0);});}
  if(!filtered.length)return '<p style="text-align:center;color:#64748b;padding:24px 0;font-size:12px">لا نتائج</p>';
  var perPage=4;
  var totalPages=Math.ceil(filtered.length/perPage);
  var page=Math.min(STATE.clientPage||0,totalPages-1);
  var start=page*perPage;
  var pageItems=filtered.slice(start,start+perPage);
  var html=pageItems.map(function(c){
    return '<div style="border-radius:14px;background:#0a1931;border:1px solid rgba(255,255,255,.05);padding:12px;margin-bottom:8px">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'+
      '<div><p style="font-size:12px;font-weight:700;margin:0">'+esc(c.name)+'</p><p style="font-size:11px;color:#94a3b8;margin:2px 0 0" dir="ltr">'+esc(c.phone)+'</p></div>'+
     '<div style="text-align:right"><p style="font-size:10px;color:#94a3b8;margin:0">صلاحية: '+esc(c.expiry)+'</p><p style="font-size:10px;color:'+(c.plan==="basic"?"#94a3b8":"#f5c542")+';margin:2px 0 0">'+(c.plan==="basic"?"🥉 أساسية":"🥇 احترافية")+'</p>'+(STATE.clientsFilter==="activity"?'<p style="font-size:10px;color:#60a5fa;margin:2px 0 0">🚪 دخول: '+(c.used||0)+' مرة</p>':'')+'</div>'+
    '</div>'+
    (c.codePlain?'<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><code style="flex:1;font-size:11px;font-family:monospace;color:#f5c542;background:#1e3a5f;padding:4px 8px;border-radius:999px;text-align:center">'+esc(c.codePlain)+'</code><button onclick="event.stopPropagation();copyClientInfo(\''+c.id+'\')" style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:12px;cursor:pointer">📋</button></div>':'')+
    '<div style="display:flex;justify-content:flex-end;gap:6px">'+
      '<button onclick="event.stopPropagation();renewClient(\''+c.id+'\')" style="width:32px;height:32px;border-radius:50%;background:rgba(245,197,66,.15);color:#f5c542;border:1px solid rgba(245,197,66,.3);font-size:12px;cursor:pointer">🔄</button>'+
      '<button onclick="event.stopPropagation();changePlan(\''+c.id+'\')" style="width:32px;height:32px;border-radius:50%;background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.3);font-size:12px;cursor:pointer">💎</button>'+
      '<button onclick="event.stopPropagation();resetDevice(\''+c.id+'\')" title="فك ربط الجهاز" style="width:32px;height:32px;border-radius:50%;background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3);font-size:12px;cursor:pointer">📱</button>'+
      '<button data-del-client="'+c.id+'" style="width:32px;height:32px;border-radius:50%;background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2);font-size:12px">🗑</button>'+
    '</div>'+
    '</div>';
  }).join("");
  if(totalPages>1){
    html+='<div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px">'+
    '<button onclick="goClientPage(\'prev\')" style="height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer">السابق</button>'+

    '</div>';
  }
  return html;
}

function updateStats(){
  var total=STATE.clients.length;
  var now=new Date();
  var monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  var weekFromNow=new Date(now.getTime()+7*24*60*60*1000);
  var active=0,expired=0,devices=0,newThisMonth=0,expiring=0;
  STATE.clients.forEach(function(c){
    var exp=new Date(c.expiry);
    if(exp>=now){
      active++;
      if(exp<=weekFromNow)expiring++;
    }else{
      expired++;
    }
    devices+=(c.used||0);
    if(c.createdAt){var cDate=new Date(c.createdAt);if(cDate>=monthStart)newThisMonth++;}
  });
  var el1=document.getElementById("stat-total");if(el1)el1.textContent=total;
  var el2=document.getElementById("stat-active");if(el2)el2.textContent=active;
  var el3=document.getElementById("stat-expired");if(el3)el3.textContent=expired;
  var el4=document.getElementById("stat-devices");if(el4)el4.textContent=devices;
  var el5=document.getElementById("stat-new");if(el5)el5.textContent=newThisMonth;
  var el6=document.getElementById("stat-expiring");if(el6)el6.textContent=expiring;
}

async function handleLogin(){
  if(lockLeft()>0)return toast("محاولات كتير - حاولي بعد "+Math.ceil(lockLeft()/60000)+" دقيقة","err");

CUSTOM_RECIPES=[];

if(!document.getElementById("terms-check")?.checked)return toast("لازم توافقي على شروط الاستخدام","err");

  if(!code)return toast("اكتبي كود الدخول","err");

  try{

  const hash=await SEC.hash(code);

  

  try{
    const adminQ=await db.collection("admins").where("codeHash","==",hash).limit(1).get();
    if(!adminQ.empty){
      const u={role:"admin",name:name||"محمد نصر"};
      SEC.sess(u,120);STATE.user=u;toast("أهلاً بك يا أدمن");go("admin");return;
    }
  }catch(e){console.log("admins check failed:",e);}


  const q=await COL.where("codeHash","==",hash).limit(1).get();
    if(q.empty)return failLogin("الكود غير صحيح");localStorage.p1p_fail=0;

    const d=q.docs[0];const client={id:d.id,...d.data()};

    const _ex=new Date(client.expiry);if(!client.expiry||isNaN(_ex)||_ex<new Date())return toast("منتهي الصلاحية","err");

    if(client.deviceId&&client.deviceId!==SEC.dev())return toast("مربوط بجهاز آخر","err");

    await d.ref.update({deviceId:SEC.dev(),used:firebase.firestore.FieldValue.increment(1),lastLogin:new Date().toISOString()});

   const u={role:"client",name:client.name,phone:client.phone,id:client.id,plan:client.plan||"pro"};

    SEC.sess(u,120);STATE.user=u;toast("أهلاً "+client.name);go("dashboard");

  }catch(e){console.error(e);toast("خطأ في الاتصال","err");}

}

async function handleAddClient(){

  const n=SEC.clean(document.getElementById("n-name").value);

  const p=SEC.clean(toEnglishNum(document.getElementById("n-phone").value));

  const c=SEC.clean(toEnglishNum(document.getElementById("n-code").value));

  const e=document.getElementById("n-exp").value;

  const d=parseInt(document.getElementById("n-dev").value);
  const plan=document.getElementById("n-plan").value;

  if(!n||!p||!c)return toast("كملي كل البيانات","err");

  if(!SEC.phone(p))return toast("رقم الموبايل غير صحيح","err");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e)||isNaN(new Date(e)))return toast("اختاري تاريخ صلاحية صحيح","err");
  if(!(d>=1&&d<=10))return toast("عدد الأجهزة غير صحيح","err");
  if(c.length<10)return toast("الكود قصير - استخدمي زر التوليد","err");

  try{

    const hash=await SEC.hash(c);

    const q=await COL.where("codeHash","==",hash).limit(1).get();

    if(!q.empty)return toast("الكود مستخدم","err");

 await COL.add({name:n,phone:p,codeHash:hash,codePlain:c,expiry:e,devices:d,plan:plan,used:0,deviceId:null,createdAt:new Date().toISOString()}); 

    document.getElementById("n-name").value="";

    document.getElementById("n-phone").value="";

    document.getElementById("n-code").value="";

    toast("تم إضافة العميل ✓");

  }catch(e){console.error(e);toast("فشل الحفظ","err");}

}

async function resetDevice(id){
  var c=STATE.clients.find(function(x){return x.id===id});if(!c)return;
  if(!confirm("فك ربط الجهاز للعميل "+c.name+"؟"))return;
  try{await COL.doc(id).update({deviceId:null});toast("تم فك الربط ✓");}catch(e){toast("فشل","err");}
}
async function changePlan(id){
  var client=STATE.clients.find(function(c){return c.id===id;});
  if(!client)return;
  var current=client.plan||"pro";
  var newPlan=current==="basic"?"pro":"basic";
  var confirmMsg="تغيير باقة "+client.name+" من\n"+(current==="basic"?"🥉 أساسية":"🥇 احترافية")+"\nإلى\n"+(newPlan==="basic"?"🥉 أساسية":"🥇 احترافية")+"؟";
  if(!confirm(confirmMsg))return;
  try{
    await COL.doc(id).update({plan:newPlan});
    toast("تم تغيير الباقة ✓");
  }catch(e){console.error(e);toast("فشل التغيير","err");}
}
async function renewClient(id){
  var client=STATE.clients.find(function(c){return c.id===id;});
  if(!client)return;
  var newExp=prompt("📅 تاريخ الصلاحية الجديد للعميل: "+client.name+"\n\n(اكتبي بصيغة YYYY-MM-DD)\n\nالتاريخ الحالي: "+client.expiry,client.expiry);
  if(!newExp)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(newExp)){toast("صيغة التاريخ غلط - استخدمي YYYY-MM-DD","err");return;}
  try{
    await COL.doc(id).update({expiry:newExp});
    toast("تم تجديد الصلاحية ✓");
  }catch(e){console.error(e);toast("فشل التجديد","err");}
}

async function delClient(id){
  var client=STATE.clients.find(function(c){return c.id===id;});
  if(!client)return;
  var confirmText=prompt("⚠️ تحذير: حذف العميل نهائياً!\n\nاكتبي اسم العميل كامل للتأكيد:\n"+client.name);
  if(confirmText===null)return;
  if(confirmText.trim()!==client.name.trim()){toast("الاسم غير مطابق - تم إلغاء الحذف","err");return;}
  try{await COL.doc(id).delete();toast("تم الحذف ✓");}catch(e){toast("فشل الحذف","err");}
}



(function(){

  const s=SEC.getSess();

  if(s){STATE.user=s.u;STATE.screen=s.u.role==="admin"?"admin":"dashboard";
    if(s.u.role==="client"&&s.u.id){COL.doc(s.u.id).get().then(function(d){var x=d.exists?d.data():null;var ex=x&&new Date(x.expiry);if(!x||isNaN(ex)||ex<new Date()||(x.deviceId&&x.deviceId!==SEC.dev())){toast("انتهى الاشتراك أو تم إيقاف الجلسة","err");logout();}}).catch(function(){});}
  }

  else STATE.screen="login";

  render();

})();

</script>
