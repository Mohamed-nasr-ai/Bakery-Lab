    if(num>0&&num<=5){
      if(num===1)el.value='ساعة';
      else if(num===2)el.value='ساعتين';
      else el.value=num+' ساعات';

  }else if(type==='temp'){el.value=num+'°م';}
  else if(type==='cal'){el.value=num+' سعرة';}
  else{el.value=num+' '+defaultUnit;}
}

  if(STATE.screen==="customerRecipes"||STATE.screen==="archivedRecipes"){STATE.screen="admin";render();window.scrollTo(0,0);return;}

  dn.onclick=function(){window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};
  document.body.appendChild(dn);
  if(window._scrollHandler)window.removeEventListener("scroll",window._scrollHandler);
  var _ticking=false;
  window._scrollHandler=function(){
    if(_ticking)return;_ticking=true;
    requestAnimationFrame(function(){
      var y=window.scrollY||window.pageYOffset||0;
      var h=document.documentElement.scrollHeight-window.innerHeight;
      if(y>150){up.style.display="flex";up.style.opacity="1";}else{up.style.opacity="0";setTimeout(function(){if(up.style.opacity==="0")up.style.display="none";},300);}

function getCatCount(catId){
  var limit=(STATE.user&&STATE.user.plan==="basic")?100:200;
  var customs=CUSTOM_RECIPES||[];
  var adminR=STATE.adminRecipes||[];
  if(catId==="all")return RECIPES.filter(function(r){return r.id<=limit;}).length+adminR.length+customs.length;
  if(catId==="fav")return 0;
  if(catId==="custom")return customs.length;
  return RECIPES.filter(function(r){return r.id<=limit&&r.c===catId;}).length+adminR.filter(function(r){return r.c===catId;}).length;
}

function renderRecipesList(){
  const s=STATE.search.trim().toLowerCase();
  const allRecipes=RECIPES.concat(STATE.adminRecipes||[]).concat(CUSTOM_RECIPES||[]);
  const limit=(STATE.user&&STATE.user.plan==="basic")?100:200;
  const filtered=allRecipes.filter(r=>{
    if(typeof r.id==="number"&&r.id>limit)return false;
    const okCat=STATE.cat==="all"?(r.custom!==true||r.isAdminRecipe):(STATE.cat==="fav"?isFav(r.id):(STATE.cat==="custom"?(r.custom===true&&!r.isAdminRecipe):(r.c===STATE.cat&&(r.custom!==true||r.isAdminRecipe))));
    const okS=!s||r.t.toLowerCase().includes(s)||r.d.toLowerCase().includes(s)||(r.ing||[]).some(i=>String(i[0]||"").toLowerCase().includes(s));
    return okCat&&okS;
  });
  if(!filtered.length)return '<p style="text-align:center;color:#64748b;padding:40px 0;font-size:13px">لا نتائج</p>';
  return filtered.map(r=>'<button data-recipe="'+esc(r.id)+'" style="position:relative;width:100%;text-align:right;border-radius:20px;background:#1e3a5f;border:1px solid rgba(255,255,255,.05);padding:16px;display:flex;flex-direction:column;gap:8px">'+
    (r.image?'<img class="recipe-thumb" src="'+safeImg(r.image)+'" alt="'+esc(r.t)+'" loading="lazy" onerror="this.style.display=\'none\'"/>':'')+
    '<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:10px;padding:4px 10px;border-radius:999px;background:#0a1931;border:1px solid rgba(255,255,255,.1);color:#94a3b8">'+esc(r.cat)+'</span><span style="font-size:10px;color:#64748b">'+esc(r.origin||"وصفة")+' • '+esc(r.difficulty||"")+'</span></div>'+
    '<h3 style="font-size:14px;font-weight:700;margin:0;line-height:1.6">'+esc(r.t)+'</h3>'+
    '<p style="font-size:11px;color:#94a3b8;margin:0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+esc(r.d)+'</p>'+
    '<div style="display:flex;gap:8px;margin-top:4px">'+
      '<span style="font-size:10px;padding:4px 8px;border-radius:999px;background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.2)">'+(r.baseYield||'—')+' '+esc(r.unit||'قطعة')+'</span>'+
      '<span style="font-size:10px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.05);color:#94a3b8">'+esc((r.time&&r.time.prep)||'—')+'</span>'+
      '<span onclick="event.stopPropagation();toggleFav(\''+sid(r.id)+'\')" style="position:absolute;bottom:16px;left:16px;font-size:22px;cursor:pointer;z-index:5;line-height:1;user-select:none">'+(isFav(r.id)?"❤️":"🤍")+'</span>'+
    '</div></button>').join("");
}

function openEditRecipe(){

async function deleteCustomRecipe(){
  var r=STATE.sel;if(!r||(String(r.id).charAt(0)!=="c"&&String(r.id).charAt(0)!=="a"))return;
  var realId=r.id.substring(1);
  showConfirm("🗑 حذف الوصفة","متأكد من حذف: \""+r.t+"\"؟",async function(){
    try{await CUSTOM_COL.doc(realId).delete();toast("تم حذف الوصفة ✓");
      if(STATE.user&&STATE.user.role==="admin"){STATE.screen=STATE.cameFrom||"customerRecipes";}
      else{STATE.screen="dashboard";STATE.cat="custom";}
      render();window.scrollTo(0,0);
    }catch(e){toast("فشل الحذف","err");}

async function saveCustomRecipe(){
  var ed=STATE.editingRecipe||null;
  var u=STATE.user||{};
  var isAdminUser=(STATE.user&&STATE.user.role==="admin")?true:false;
  var title=toEnglishNum(document.getElementById("cr-title").value.trim());
  var cat=document.getElementById("cr-cat").value;
  var desc=toEnglishNum(document.getElementById("cr-desc").value.trim());
  var ingText=toEnglishNum(document.getElementById("cr-ing").value.trim());
  var stepsText=toEnglishNum(document.getElementById("cr-steps").value.trim());
  var toolsText=toEnglishNum(document.getElementById("cr-tools").value.trim());
  var tip=toEnglishNum(document.getElementById("cr-tip").value.trim());
  var shelf=toEnglishNum(document.getElementById("cr-shelf").value.trim());
  var store=toEnglishNum(document.getElementById("cr-store").value.trim());
  var unit=toEnglishNum(document.getElementById("cr-unit").value.trim())||"قطعة";
  var baseYield=parseInt(toEnglishNum(document.getElementById("cr-baseyield").value))||8;
  var temp=toEnglishNum(document.getElementById("cr-temp").value.trim());
  var timeprep=toEnglishNum(document.getElementById("cr-timeprep").value.trim());
  var timerest=toEnglishNum(document.getElementById("cr-timerest").value.trim());
  var timebake=toEnglishNum(document.getElementById("cr-timebake").value.trim());
  var allergensRaw=document.getElementById("cr-allergens").value.trim();
  var cal=toEnglishNum(document.getElementById("cr-cal").value.trim());
  var countryInput=document.getElementById("cr-country");
  var standardInput=document.getElementById("cr-standard");
  var country=countryInput?toEnglishNum(countryInput.value.trim()):"";
  var standard=standardInput?toEnglishNum(standardInput.value.trim()):"";
  var originParts=[country,standard].filter(function(x){return x;});
  var origin=originParts.join(" • ");
  var difficulty=(document.getElementById("cr-difficulty")||{}).value||"متوسط";
  var allergens=allergensRaw?allergensRaw.split(",").map(function(x){return x.trim();}).filter(function(x){return x;}):[];
  if(!title||!desc||!ingText||!stepsText||!shelf||!store){toast("اكتبي كل البيانات الأساسية","err");return;}
  var catNames={oriental:"مخبوزات شرقية",western:"مخبوزات غربية","pastry-east":"معجنات شرقية","pastry-west":"معجنات غربية","sweet-east":"حلويات شرقية","sweet-west":"حلويات غربية"};
  // ✨ تحليل المكونات مع الوحدة
  var validUnits=['جم','جرام','جرامات','g','مل','ml','قطعة','قطعة','كوب','كوب','ملعقة','ملعقة','معلقة','رشة','سعرة','كيلو','كجم'];
  var parsedIngs=ingText.split("\n").filter(function(x){return x.trim();}).map(function(x){
    var parts=x.split(/\s*[\-–—,]\s*/).map(function(p){return p.trim();}).filter(Boolean);
    var name=parts[0]||x.trim();
    var qty=parts[1]?parseQty(parts[1]):0;
    if(isNaN(qty))qty=0;
    var unitField=parts[2]||'';
    var note=parts[3]||'';
    if(!validUnits.some(function(u){return unitField===u;})){
      if(unitField&&note)note=unitField+" "+note;
      else if(unitField)note=unitField;
      unitField='جم';
    }
    return {name:name,qty:qty,unit:unitField,note:note};
  });
  var flourQty=parsedIngs.reduce(function(a,i){return a+(/دقيق|flour|طحين|سميد/.test(i.name)?i.qty:0)},0)||(parsedIngs[0]?parsedIngs[0].qty:0);
  // صيغة جديدة: [اسم, كمية, baker%, note, unit]
  var ings=parsedIngs.map(function(i){var pct=flourQty?Math.round((i.qty/flourQty)*1000)/10:0;return [i.name, String(i.qty), pct+"%", i.note, i.unit];});
  var steps=stepsText.split("\n").filter(function(x){return x.trim();}).map(function(x){return x.trim();});
  var tools=toolsText?toolsText.split("\n").filter(function(x){return x.trim();}).map(function(x){return x.trim();}):["—"];
  try{
    var recipeData={
      isAdminRecipe:(STATE.user&&STATE.user.role==="admin"&&!ed)?true:((ed&&ed.isAdminRecipe)?true:false),
      ownerId:(ed&&ed.ownerId)?ed.ownerId:(u.id||""),
      ownerName:(ed&&ed.ownerName)?ed.ownerName:(u.name||""),
      t:title,c:cat,cat:catNames[cat]||"مخبوزات شرقية",es:"CUSTOM",iso:"CUSTOM",
      origin:isAdminUser?(origin||"وصفة جديدة"):("وصفة مخصصة من "+(u.name||"")),
      difficulty:difficulty||"متوسط",
      d:desc,unit:unit,baseYield:baseYield,
      time:{prep:timeprep||"—",rest:timerest||"—",bake:timebake||"—"},
      temp:temp||"—",shelf:shelf,store:store,cal:cal||"—",
      allergens:allergens,
      warn:isAdminUser?[]:["⚠️ وصفة مخصصة من "+(u.name||"")+" - هذه الوصفة مسؤولية صاحبها"],
      ing:ings,tools:tools,steps:steps,tip:tip||"—",cost:"—",profit:"—",
      image:ed&&ed.image?ed.image:bakeryImg("🍽","وصفة","#4A5568","#1A202C"),
      custom:true
    };
    if(ed){await CUSTOM_COL.doc(ed.fbId).update(recipeData);toast("✓ تم حفظ التعديل");}
    else{recipeData.createdAt=new Date().toISOString();recipeData.displayNum=(STATE.adminRecipes?STATE.adminRecipes.length:0)+201;await CUSTOM_COL.add(recipeData);toast("✓ تم حفظ الوصفة");}
    STATE.editingRecipe=null;
    if(recipeData.isAdminRecipe){STATE.screen="dashboard";STATE.cat="all";}
    else if(STATE.user&&STATE.user.role==="admin"){STATE.screen=STATE.cameFrom||"customerRecipes";}
    else{STATE.screen="dashboard";STATE.cat="custom";}
    render();window.scrollTo(0,0);
  }catch(e){console.error(e);toast("فشل: "+(e.message||e.code||"غير معروف"),"err");}
}

function resetCostEditor(){var r=STATE.sel;if(!r)return;localStorage.removeItem("bakery_cost_"+r.id+"_unitCost");localStorage.removeItem("bakery_cost_"+r.id+"_fixedCost");localStorage.removeItem("bakery_cost_"+r.id+"_sellPrice");closeCostEditor();toast("تم الاسترجاع ✓");render();}

function fixYieldInput(){var input=document.getElementById("yield-input");if(!input)return;var val=parseInt(toEnglishNum(input.value));if(isNaN(val)||val<1)val=1;else if(val>200)val=200;input.value=val;STATE.currentYield=val;updateYields(val);}
function changeYield(delta){var input=document.getElementById("yield-input");if(!input)return;var val=Math.max(1,Math.min(200,(parseInt(toEnglishNum(input.value))||1)+delta));input.value=val;updateYields(val);}
function setYield(val){var input=document.getElementById("yield-input");if(input)input.value=val;updateYields(val);}
function updateYields(newYield){
  var r=STATE.sel;if(!r||!r.baseYield)return;
  newYield=toEnglishNum(String(newYield||""));if(newYield===''||newYield===null||newYield===undefined)return;
  var num=parseInt(newYield);if(isNaN(num)||num<1)return;num=Math.min(200,num);
  STATE.currentYield=num;var factor=num/r.baseYield;
  document.querySelectorAll(".ing-amount").forEach(function(el){
    var base=parseFloat(el.dataset.base)||0;
    var u=el.dataset.unit||"جم";
    var amount=base*factor;
    var display=(amount%1===0)?amount:amount.toFixed(1);
    el.textContent=display+" "+u;
  });
}

function renderTools(r){
  return '<div style="margin-top:20px;display:flex;flex-direction:column;gap:8px"><p style="font-size:11px;color:#94a3b8;margin:0 0 8px">أدوات المطبخ المطلوبة</p>'+

}

function fillVars(text, r, factor){
  if(!text||!r||!r.ing)return text;
  return String(text).replace(/\{\{(\d+)\}\}/g, function(m, idx){
    var ing=r.ing[parseInt(idx)];if(!ing)return m;
    var base=parseFloat(ing[1])||0;var val=base*factor;
    var display=(val%1===0)?val:val.toFixed(1);
    return display;
  });
}

function getFilteredClients(){
  var now=new Date();var weekFromNow=new Date(now.getTime()+7*24*60*60*1000);
  var monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  var flt=STATE.clientsFilter||"all";
  var search=(STATE.clientSearch||"").toLowerCase().trim();
  var filtered=STATE.clients.filter(function(c){
    var exp=expEnd(c.expiry);
    if(flt==="active"&&!(exp>=now))return false;
    if(flt==="expired"&&!(exp<now))return false;
    if(flt==="expiring"&&!(exp>=now&&exp<=weekFromNow))return false;
    if(flt==="new"){if(!c.createdAt)return false;if(new Date(c.createdAt)<monthStart)return false;}
    if(!search)return true;
    return (c.name||"").toLowerCase().includes(search)||(c.phone||"").includes(search)||(c.codePlain||"").toLowerCase().includes(search);
  });
  if(flt==="activity"){filtered.sort(function(a,b){return (b.used||0)-(a.used||0);});}
  return filtered;
}

function renderClientsList(){
  if(!STATE.clients.length)return '<p style="text-align:center;color:#64748b;padding:24px 0;font-size:12px">لا يوجد عملاء بعد</p>';
  var filtered=getFilteredClients();
  if(!filtered.length)return '<p style="text-align:center;color:#64748b;padding:24px 0;font-size:12px">لا نتائج</p>';
  var perPage=4;var totalPages=Math.ceil(filtered.length/perPage);
  var page=Math.min(STATE.clientPage||0,totalPages-1);var start=page*perPage;
  var pageItems=filtered.slice(start,start+perPage);
  var html=pageItems.map(function(c){
    return '<div style="border-radius:14px;background:#0a1931;border:1px solid rgba(255,255,255,.05);padding:12px;margin-bottom:8px">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><p style="font-size:12px;font-weight:700;margin:0">'+esc(c.name)+'</p><p style="font-size:11px;color:#94a3b8;margin:2px 0 0" dir="ltr">'+esc(c.phone)+'</p></div>'+
    '<div style="text-align:right"><p style="font-size:10px;color:#94a3b8;margin:0">صلاحية: '+esc(c.expiry)+'</p><p style="font-size:10px;color:'+(c.plan==="basic"?"#94a3b8":"#f5c542")+';margin:2px 0 0">'+(c.plan==="basic"?"🥉 أساسية":"🥇 احترافية")+'</p>'+(STATE.clientsFilter==="activity"?'<p style="font-size:10px;color:#60a5fa;margin:2px 0 0">🚪 '+(c.used||0)+'</p>':'')+'</div></div>'+
    (c.codePlain?'<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><code style="flex:1;font-size:11px;font-family:monospace;color:#f5c542;background:#1e3a5f;padding:4px 8px;border-radius:999px;text-align:center">'+esc(c.codePlain)+'</code><button onclick="event.stopPropagation();copyClientInfo(\''+sid(c.id)+'\')" style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:12px;cursor:pointer">📋</button></div>':'')+
    '<div style="display:flex;justify-content:flex-end;gap:6px">'+
      '<button onclick="event.stopPropagation();renewClient(\''+sid(c.id)+'\')" style="width:32px;height:32px;border-radius:50%;background:rgba(245,197,66,.15);color:#f5c542;border:1px solid rgba(245,197,66,.3);font-size:12px;cursor:pointer">🔄</button>'+
      '<button onclick="event.stopPropagation();changePlan(\''+sid(c.id)+'\')" style="width:32px;height:32px;border-radius:50%;background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.3);font-size:12px;cursor:pointer">💎</button>'+
      '<button onclick="event.stopPropagation();resetDevice(\''+sid(c.id)+'\')" style="width:32px;height:32px;border-radius:50%;background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3);font-size:12px;cursor:pointer">📱</button>'+
      '<button data-del-client="'+sid(c.id)+'" style="width:32px;height:32px;border-radius:50%;background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2);font-size:12px">🗑</button>'+
    '</div></div>';
  }).join("");
  if(totalPages>1){html+='<div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px"><button onclick="goClientPage(\'prev\')" style="height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer">السابق</button><span style="font-size:11px;color:#94a3b8">'+(page+1)+' / '+totalPages+'</span><button onclick="goClientPage(\'next\')" style="height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer">التالي</button></div>';}
  return html;
}

function csvCell(v){v=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function exportToExcel(){
  if(!STATE.clients||!STATE.clients.length){toast("لا يوجد عملاء","err");return;}
  var csv="الاسم,الموبايل,الصلاحية,عدد الاجهزة,المستخدم,تاريخ الانشاء\n";
  STATE.clients.forEach(function(c){csv+=[c.name,c.phone,c.expiry,c.devices,c.used||0,(c.createdAt||"").slice(0,10)].map(csvCell).join(",")+"\n";});
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="bakery-lab-clients-"+Date.now()+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
  toast("تم التصدير ✓");
}

function getFavsKey(){var u=STATE.user||{};return "bakery_favs_"+(u.id||"guest");}
function getFavs(){try{return JSON.parse(localStorage.getItem(getFavsKey())||"[]");}catch(e){return[];}}
function isFav(id){return getFavs().indexOf(String(id))>-1;}
function toggleFav(id){id=String(id);var favs=getFavs();var idx=favs.indexOf(id);if(idx>-1){favs.splice(idx,1);toast("اتشالت");}else{favs.push(id);toast("اتضافت ❤️");}try{localStorage.setItem(getFavsKey(),JSON.stringify(favs));}catch(e){}var _l=document.getElementById("recipes-list");if(STATE.screen==="dashboard"&&_l){_l.innerHTML=renderRecipesList();bindRecipeBtns();}else render();}

function updateStats(){
  var total=STATE.clients.length;var now=new Date();
  var monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  var weekFromNow=new Date(now.getTime()+7*24*60*60*1000);
  var active=0,expired=0,devices=0,newThisMonth=0,expiring=0;
  STATE.clients.forEach(function(c){
    var exp=expEnd(c.expiry);
    if(exp>=now){active++;if(exp<=weekFromNow)expiring++;}else{expired++;}
    devices+=(c.used||0);
    if(c.createdAt){var cDate=new Date(c.createdAt);if(cDate>=monthStart)newThisMonth++;}
  });
  var e1=document.getElementById("stat-total");if(e1)e1.textContent=total;
  var e2=document.getElementById("stat-active");if(e2)e2.textContent=active;
  var e3=document.getElementById("stat-expired");if(e3)e3.textContent=expired;
  var e4=document.getElementById("stat-devices");if(e4)e4.textContent=devices;
  var e5=document.getElementById("stat-new");if(e5)e5.textContent=newThisMonth;
  var e6=document.getElementById("stat-expiring");if(e6)e6.textContent=expiring;
}

function goClientPage(dir){
  var filtered=getFilteredClients();
  var totalPages=Math.max(1,Math.ceil(filtered.length/4));
  if(dir==="prev")STATE.clientPage=Math.max(0,(STATE.clientPage||0)-1);
  else STATE.clientPage=Math.min(totalPages-1,(STATE.clientPage||0)+1);
  var list=document.getElementById("clients-list");
  if(list){list.innerHTML=renderClientsList();bindClientBtns();}
}

function copyClientInfo(id){
  var c=STATE.clients.find(function(x){return x.id===id;});if(!c)return;
  var txt="👤 "+c.name+"\n📱 "+c.phone+"\n🔑 "+(c.codePlain||"")+"\n📅 "+c.expiry+"\n💻 "+(c.used||0)+"/"+c.devices+"\n\n🥖 Bakery Lab";
  var ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;top:0;left:0;opacity:0;pointer-events:none";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,99999);try{document.execCommand("copy");toast("تم النسخ ✓");}catch(e){toast("فشل النسخ","err");}document.body.removeChild(ta);
}

function bindClientBtns(){document.querySelectorAll("[data-del-client]").forEach(b=>b.onclick=()=>delClient(b.dataset.delClient));}

function bindRecipeBtns(){
  document.querySelectorAll("[data-recipe]").forEach(b=>b.onclick=()=>{
    var id=b.dataset.recipe;
    var r=RECIPES.find(function(x){return String(x.id)===String(id);});
    if(!r&&typeof CUSTOM_RECIPES!=="undefined"){r=CUSTOM_RECIPES.find(function(x){return String(x.id)===String(id);});}
    if(!r&&STATE.adminRecipes){r=STATE.adminRecipes.find(function(x){return String(x.id)===String(id);});}
    if(r){
      if(!r.displayNum){if(typeof r.id==="number")r.displayNum=r.id;else if(String(r.id).charAt(0)==="a")r.displayNum=201+(STATE.adminRecipes||[]).indexOf(r);}
      STATE.cameFrom=STATE.screen;
      go("detail",{sel:r,tab:"ing"});
    }
  });
}

function lockLeft(){const l=+localStorage.p1p_lock||0;return Math.max(0,l-Date.now())}
function failLogin(msg){const n=(+localStorage.p1p_fail||0)+1;localStorage.p1p_fail=n;if(n>=5){localStorage.p1p_lock=Date.now()+15*60000;localStorage.p1p_fail=0;return toast("محاولات كتير - حاولي بعد 15 دقيقة","err")}return toast(msg,"err")}

async function handleLogin(){
  if(lockLeft()>0)return toast("محاولات كتير - حاولي بعد "+Math.ceil(lockLeft()/60000)+" دقيقة","err");
  CUSTOM_RECIPES=[];
  const name=SEC.clean(document.getElementById("in-name").value);
  const code=SEC.clean(toEnglishNum(document.getElementById("in-code").value));
  if(!name)return toast("اكتبي اسمك","err");
  if(!document.getElementById("terms-check")?.checked)return toast("لازم توافقي على الشروط","err");
  if(!code)return toast("اكتبي الكود","err");
  try{
    const hash=await SEC.hash(code);
    try{const adminQ=await db.collection("admins").where("codeHash","==",hash).limit(1).get();
      if(!adminQ.empty){const u={role:"admin",name:name||"محمد نصر"};SEC.sess(u,120);STATE.user=u;toast("أهلاً يا أدمن");go("admin");return;}
    }catch(e){console.log("admins check failed:",e);}
    const q=await COL.where("codeHash","==",hash).limit(1).get();
    if(q.empty)return failLogin("الكود غير صحيح");localStorage.p1p_fail=0;
    const d=q.docs[0];const client={id:d.id,...d.data()};
    const _ex=expEnd(client.expiry);if(!client.expiry||isNaN(_ex)||_ex<new Date())return toast("منتهي الصلاحية","err");
    if(client.deviceId&&client.deviceId!==SEC.dev())return toast("مربوط بجهاز آخر","err");
    await d.ref.update({deviceId:SEC.dev(),used:firebase.firestore.FieldValue.increment(1),lastLogin:new Date().toISOString()});
    const u={role:"client",name:client.name,phone:client.phone,id:client.id,plan:client.plan||"pro"};
    SEC.sess(u,120);STATE.user=u;toast("أهلاً "+client.name);go("dashboard");
  }catch(e){console.error(e);toast("خطأ في الاتصال","err");}
}

function logout(){
  if(STATE.customUnsub){STATE.customUnsub();STATE.customUnsub=null;}
  if(STATE.unsub){STATE.unsub();STATE.unsub=null;}
  if(STATE.allCustomUnsub){STATE.allCustomUnsub();STATE.allCustomUnsub=null;}
  if(STATE.adminRecipesUnsub){STATE.adminRecipesUnsub();STATE.adminRecipesUnsub=null;}
  CUSTOM_RECIPES=[];SEC.out();STATE.user=null;STATE.clientSearch="";STATE.customerRecipeSearch="";STATE.search="";STATE.cat="all";
  var wc=document.getElementById("wm-client");if(wc)wc.remove();
  go("login",null,true);
}

async function handleAddClient(){
  const n=SEC.clean(document.getElementById("n-name").value);
  const p=SEC.clean(toEnglishNum(document.getElementById("n-phone").value));
  const c=SEC.clean(toEnglishNum(document.getElementById("n-code").value));
  const e=document.getElementById("n-exp").value;
  const d=parseInt(document.getElementById("n-dev").value);
  const plan=document.getElementById("n-plan").value;
  if(!n||!p||!c)return toast("كملي البيانات","err");
  if(!SEC.phone(p))return toast("رقم غير صحيح","err");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e)||isNaN(new Date(e)))return toast("تاريخ غير صحيح","err");
  if(!(d>=1&&d<=10))return toast("عدد الأجهزة غير صحيح","err");
  if(c.length<10)return toast("الكود قصير","err");
  try{
    const hash=await SEC.hash(c);
    const q=await COL.where("codeHash","==",hash).limit(1).get();
    if(!q.empty)return toast("الكود مستخدم","err");
    await COL.add({name:n,phone:p,codeHash:hash,codePlain:c,expiry:e,devices:d,plan:plan,used:0,deviceId:null,createdAt:new Date().toISOString()});
    document.getElementById("n-name").value="";document.getElementById("n-phone").value="";document.getElementById("n-code").value="";
    toast("تم إضافة العميل ✓");
  }catch(e){console.error(e);toast("فشل الحفظ","err");}
}

async function resetDevice(id){var c=STATE.clients.find(function(x){return x.id===id});if(!c)return;if(!confirm("فك ربط الجهاز للعميل "+c.name+"؟"))return;try{await COL.doc(id).update({deviceId:null});toast("تم فك الربط ✓");}catch(e){toast("فشل","err");}}

async function changePlan(id){var client=STATE.clients.find(function(c){return c.id===id;});if(!client)return;var current=client.plan||"pro";var newPlan=current==="basic"?"pro":"basic";if(!confirm("تغيير باقة "+client.name+"؟"))return;try{await COL.doc(id).update({plan:newPlan});toast("تم التغيير ✓");}catch(e){toast("فشل","err");}}

async function renewClient(id){var client=STATE.clients.find(function(c){return c.id===id;});if(!client)return;var newExp=prompt("📅 تاريخ جديد للعميل: "+client.name+"\n(YYYY-MM-DD)",client.expiry);if(!newExp)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(newExp)){toast("صيغة غلط","err");return;}try{await COL.doc(id).update({expiry:newExp});toast("تم التجديد ✓");}catch(e){toast("فشل","err");}}

async function delClient(id){
  var client=STATE.clients.find(function(c){return c.id===id;});if(!client)return;
  var input=prompt("⚠️ حذف نهائي!\n\nاكتبي اسم العميل كامل:\n"+client.name);
  if(input===null)return;
  if(input.trim()!==client.name.trim()){toast("الاسم غير مطابق - تم الإلغاء","err");return;}
  try{await COL.doc(id).delete();toast("تم الحذف ✓");}catch(e){toast("فشل","err");}
}

  } else STATE.screen="login";
  render();
  if(loader)setTimeout(function(){loader.style.display="none";},300);
})();
